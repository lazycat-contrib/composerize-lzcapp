version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/composerize.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: composerize
    # 上游只有 mutable latest tag，无 immutable 家族 → digest 变化即 patch bump
    bump: patch
build:
  run_buildscript: false
images:
  - id: composerize
    target: service
    service: composerize
    source: oaklight/composerize
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Composerize
    summary: "docker-compose的转换工具集"
